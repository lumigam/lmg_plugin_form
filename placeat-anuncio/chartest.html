<!doctype html><meta charset=utf-8><style>@font-face{font-family:Poppins;src:url(fonts/poppins-latin-600-normal.woff2);font-weight:600}body{margin:0}</style>
<canvas id=c width=1500 height=1350></canvas>
<script type=module>
import {C} from './lib.js';
import {person,LUCIA,MARTA,DIEGO,walkPose,idlePose,pose,headFront,bustBody} from './people.js';
const c=document.getElementById('c').getContext('2d');
c.fillStyle='#fdf3e2';c.fillRect(0,0,1500,1350);
c.fillStyle='#e9dcc4';c.fillRect(0,720,1500,630);
person(c,230,690,{...LUCIA,s:2.3},idlePose(1,{smile:0.9,hd:-0.05}));
person(c,590,690,{...MARTA,s:2.3},idlePose(2,{smile:0.95,la:0.9,le:0.3}));
person(c,950,690,{...DIEGO,s:2.3},idlePose(3,{smile:0.9}));
person(c,1290,690,{...LUCIA,s:1.25},walkPose(1.2));
person(c,1400,690,{...MARTA,s:1.25},walkPose(2.4));
const people=[{skin:C.skin1,hair:'long',hairC:'#b5532f',eyeC:'#4d8a5a',top:C.green,lanyard:true},{skin:C.skin3,hair:'short',hairC:'#5a3a25',top:'#f5f0e6',apron:'#a8c000'},{skin:C.skin2,hair:'bun',hairC:'#7a4a2b',top:'#e0607e'},{skin:C.skin4,hair:'short',hairC:'#c9a25a',eyeC:'#4b7fb0',top:C.blue,glasses:true},{skin:C.skin1,hair:'bald',hairC:'#9a9a9a',top:'#2bb3a3',beard:true},{skin:C.skin2,hair:'long',hairC:'#e2b25c',eyeC:'#4b7fb0',top:'#e0607e'}];
people.forEach((o,i)=>{const x=130+i*250,y=1330;c.save();bustBody(c,x,y-150,o,{lsa:0.5,rsa:0.5});headFront(c,x,y-190,o,{smile:0.9});c.restore();});
</script>
